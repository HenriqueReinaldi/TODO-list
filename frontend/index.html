<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>LISTA TODO</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <div id="warning-storage" class="warning-storage" hidden></div>

        <p>Selecione um quadro:</p>
        <div class="area-quadros" id="area-quadros">

            <fieldset>
                <legend>novo quadro</legend>
                <label for="input-nome"></label>
                <input type="text" name="" id="input-nome" placeholder="nome">
            </fieldset>

        </div>

        <div id="controle-quadro" class="controle-quadro">
            <fieldset>
                <legend>quadro selecionado</legend>
                <label for="input-renomear-quadro"></label>
                <input type="text" id="input-renomear-quadro" placeholder="renomear quadro">
                <button id="btn-renomear-quadro" type="button">renomear</button>
                <button id="btn-deletar-quadro" type="button">deletar quadro</button>
            </fieldset>
        </div>

        <p>Tarefas:</p>
        <div class="area-tarefas" id="area-tarefas">


            <div class="container-tarefas permanente">
                <div class="container-titulo">Editar tarefa:</div>

                <label for="input-nome-tarefa"></label>
                <input type="text" name="" id="input-nome-tarefa" placeholder="nome (para criar nova tarefa)">

                <label for="select-status"></label>
                <select name="select" id="select-status">
                    <option value="TODO" selected>TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>

                <label for="input-categoria"></label>
                <input type="text" name="" id="input-categoria" placeholder="categoria">

                <label for="input-prioridade"></label>
                <p>prioridade:</p>
                <input type="number" name="" id="input-prioridade" value="1" min="1" max="5">

                <label for="input-descricao"></label>
                <input type="text" name="" id="input-descricao" placeholder="descricao">

                <label for="input-alarme"></label>
                <label for="check-sim-alarme">
                    <p>novo alarme?</p>
                    <input type="checkbox" name="" id="check-sim-alarme" class="checkgranmde">
                </label>
                <input type="datetime-local" name="" id="input-alarme">

                <button id="btn-salvar-adicionar">Salvar</button>
                <button id="btn-deletar">Deletar</button>
                <p id="mensagem-edicao" class="mensagem-edicao" hidden>Editando múltiplas tarefas...</p>

            </div>
        </div>

        <p>Configurações:</p>
        <div>
            <p>Modo de display:</p>
            <label for="select-display"></label>
            <select name="" id="select-display">
                <option value="L_STATUS"> Status </option>
                <option value="L_PRIORIDADE"> Prioridade </option>
                <option value="L_CATEGORIA"> Categoria </option>
                <option value="L_FDS"> Sem modo </option>
            </select>
        </div>




        <template id="template-container">

            <div class="container-tarefas temp-tarefa">
                <div class="container-titulo"></div>


            </div>

        </template>
        <script src="storage.js"></script>
        <script src="main.js"></script>

    </body>


</html>
